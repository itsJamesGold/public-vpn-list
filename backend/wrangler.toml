name = "zvpn-backend"
main = "src/index.js"
compatibility_date = "2024-01-01"

account_id = "42326c36b367947b8ff21f4f1bad14af"
workers_dev = true

# ── Custom Domain Routes ───────────────────────────────────────────────────────
routes = [
  { pattern = "z-vpn.site/*", zone_name = "z-vpn.site" },
  { pattern = "www.z-vpn.site/*", zone_name = "z-vpn.site" }
]

[[r2_buckets]]
binding = "SERVERS_BUCKET"
bucket_name = "publicvpnlist-profiles"

[[kv_namespaces]]
binding = "CORRECTIONS_KV"
id = "2fa068f640bb4c369bde5d9923ab8def"

[vars]
ENVIRONMENT = "production"

# ── Observability (free) ──────────────────────────────────────────────────────
[observability]
enabled = true

# ── Backup Cloudflare Account (Failover / Mirror) ───────────────────────────
[env.backup]
name = "zvpn-backend"
account_id = "c1d646feb93ce90e1086c4332fad68b3"
workers_dev = true
routes = []

[[env.backup.r2_buckets]]
binding = "SERVERS_BUCKET"
bucket_name = "publicvpnlist-profiles"

[[env.backup.kv_namespaces]]
binding = "CORRECTIONS_KV"
id = "23f27d68f6d64f8083a1c4434ff0eff0"

[env.backup.vars]
ENVIRONMENT = "production"
